<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calc Dojo · ลานฝึกคิดเลขในใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main class="dojo" id="main"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/core.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<script>
let heatMode='vol';
const WEEKS=52;

function heatLevel(d){if(!d||!d.a)return 0;
  if(heatMode==='vol')return d.a<10?1:d.a<25?2:d.a<50?3:4;
  const p=100*d.c/d.a;return p<60?1:p<75?2:p<90?3:4}
const pct=d=>d&&d.a?Math.round(100*d.c/d.a):null;

function heatHTML(){
  const now=new Date(),dow=(now.getDay()+6)%7,start=addDays(now,-(dow+7*(WEEKS-1)));
  let months='',cells='',prevM=-1;
  for(let w=0;w<WEEKS;w++){
    const m=addDays(start,w*7).getMonth();months+=`<span>${m!==prevM?TH_M[m]:''}</span>`;prevM=m;
    for(let r=0;r<7;r++){const d=addDays(start,w*7+r),k=dayKey(d);
      if(d>now){cells+='<i class="cell" style="visibility:hidden"></i>';continue}
      const x=D.days[k],lv=heatLevel(x),p=pct(x);
      cells+=`<button class="cell l${lv}${k===dayKey(now)?' now':''}" data-k="${k}" aria-label="${thDate(k)}: ${x&&x.a?`${x.a} ข้อ ถูก ${p}%`:'ไม่ได้เล่น'}"></button>`}}
  const dl='<span>จ</span><span></span><span>พ</span><span></span><span>ศ</span><span></span><span>อา</span>';
  return `<div class="heat-wrap" id="heatWrap"><div class="heat-m">${months}</div><div class="heat-row"><div class="heat-d" aria-hidden="true">${dl}</div><div class="heat" id="heat">${cells}</div></div></div>
   <p class="heat-read" id="heatRead" aria-live="polite"></p>
   <div class="legend" aria-hidden="true"><span>${heatMode==='vol'?'เล่นน้อย':'แม่นน้อย'}</span>${[0,1,2,3,4].map(l=>`<i class="cell l${l}"></i>`).join('')}<span>${heatMode==='vol'?'เล่นมาก':'แม่นมาก'}</span></div>`}

function readDay(k){
  const x=D.days[k];
  heatRead.innerHTML=x&&x.a?`<b>${thDate(k)}</b> · เล่น <b>${x.a}</b> ข้อ · ถูก <b>${pct(x)}%</b>`:`<b>${thDate(k)}</b> · ไม่ได้เล่น`}

function lineHTML(pts,lab,aria,fmt){
  const have=pts.filter(v=>v!==null);
  const W=Math.max(300,Math.min(760,document.documentElement.clientWidth-130)),H=84,pad=10,n=pts.length;
  const lo=Math.min(...have)-(Math.max(...have)-Math.min(...have)||1)*.25,hi=Math.max(...have)+(Math.max(...have)-Math.min(...have)||1)*.25;
  const X=i=>pad+i*(W-2*pad)/Math.max(1,n-1),Y=v=>H-pad-(v-lo)/(hi-lo||1)*(H-2*pad);
  let path='',dots='';pts.forEach((v,i)=>{if(v===null)return;path+=(path?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);dots+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.4" fill="#fff" stroke="#0b7f6a" stroke-width="2"/>`});
  return `<div class="trend"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}: ${have.map(fmt).join(', ')}"><path d="${path}" fill="none" stroke="#0b7f6a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg><p>${lab}</p></div>`}
function trendHTML(){
  const tp=tempos().slice(-20);
  const t1=tp.length>=3?lineHTML(tp,`Tempo ของ Sprint ล่าสุด ${tp.length} รอบ จาก ${tp[0].toFixed(1)} เป็น ${tp[tp.length-1].toFixed(1)}`,'Tempo รายรอบ',v=>v.toFixed(1)):`<div class="trend"><p>กราฟ Tempo จะขึ้นเมื่อเล่น Sprint ครบ 3 รอบ</p></div>`;
  const pts=[];for(let i=7;i>=0;i--){const w=winAcc(i*7+6,i*7);pts.push(w.a>=10?w.pct:null)}
  const have=pts.filter(v=>v!==null);
  const t2=have.length>=2?lineHTML(pts,`ความแม่นรายสัปดาห์ (เฉพาะสัปดาห์ที่ทำ ≥10 ข้อ) จาก ${have[0]}% เป็น ${have[have.length-1]}%`,'ความแม่นรายสัปดาห์',v=>v+'%'):`<div class="trend"><p>เส้นความแม่นรายสัปดาห์จะขึ้นเมื่อมีอย่างน้อย 2 สัปดาห์ที่ทำครบ 10 ข้อขึ้นไป</p></div>`;
  return t1+t2}

const sec=ms=>(ms/1000).toFixed(1);
function weakHTML(){
  const w=weakSpots();
  if(!w.measured)return `<p class="empty">ระบบเริ่มจับเวลาต่อข้อแล้ว เล่นหรือฝึกให้ได้อย่างน้อย ${w.need} ข้อต่อเทคนิค ระบบจะบอกว่าเทคนิคไหนเสียเวลาเป็นพิเศษ (ตอนนี้วัดได้ 0 จาก ${w.total} เทคนิค)</p>`;
  const bad=w.rows.filter(r=>r.score>=.2).slice(0,4);
  const card=r=>`<article class="ws">
    <div class="ws-h"><span class="ws-lv" style="--lc:${LV[r.t.lv].col}"></span><div><b>${r.t.en}</b><small>${r.t.th} · ${LV[r.t.lv].th}</small></div></div>
    <div class="ws-chips">${r.flags.includes('slow')?`<span class="chip bad">ช้ากว่าเทคนิคอื่นระดับเดียวกัน +${Math.round((r.ratio-1)*100)}%</span>`:''}${r.flags.includes('shaky')?`<span class="chip bad">แม่นแค่ ${Math.round(r.acc*100)}%</span>`:''}${!r.flags.length?`<span class="chip">ช้ากว่าเล็กน้อย +${Math.round((r.ratio-1)*100)}%</span>`:''}${r.trend!==null?`<span class="chip ${r.trend<=-.05?'good':''}">${r.trend<=-.05?'เร็วขึ้น '+Math.round(-r.trend*100)+'%':r.trend>=.05?'ช้าลง '+Math.round(r.trend*100)+'%':'ความเร็วคงที่'} เทียบครึ่งแรก</span>`:''}</div>
    <p class="ws-n">ตอบถูกใช้เวลากลาง <b>${sec(r.m)}</b> วินาที (เทคนิคอื่นระดับเดียวกัน ${sec(r.base)} วินาที) · จาก ${r.n} ข้อล่าสุด</p>
    <p class="ws-s">ข้อที่ช้าสุด: ${r.slow.map(e=>`<span>${esc(e[2])} <i>${sec(e[0])} วิ</i></span>`).join('')}</p>
    <div class="ws-act"><a class="btn pri" href="play.html#drill-${r.t.id}">${I('play')}ฝึกเทคนิคนี้</a><a class="btn" href="learn.html#${r.t.id}">ดูวิธีคิด</a></div></article>`;
  const mx=Math.max(...w.rows.map(r=>Math.max(r.m,r.base)));
  const bars=[...w.rows].sort((a,b)=>b.m-a.m).map(r=>`<li><span class="b-n">${r.t.en}</span><span class="b-t" aria-hidden="true"><i style="width:${Math.round(100*r.m/mx)}%;background:${LV[r.t.lv].col}"></i><u style="left:${Math.round(100*r.base/mx)}%"></u></span><span class="b-v">${sec(r.m)} วิ</span></li>`).join('');
  return `${bad.length?`<div class="ws-list">${bad.map(card).join('')}</div>`:'<p class="empty" style="margin-bottom:10px">ตอนนี้ยังไม่เจอเทคนิคที่เสียเวลาหรือพลาดผิดปกติ ดูรายละเอียดทุกเทคนิคด้านล่างได้</p>'}
   <details class="ws-all"><summary>เวลาเฉลี่ยทุกเทคนิคที่วัดได้ (${w.measured}/${w.total})</summary><ul class="bars">${bars}</ul><p class="note">แท่งคือเวลากลางของคำตอบที่ถูก เส้นขีดคือค่ากลางของเทคนิคอื่นในระดับเดียวกัน</p></details>
   <p class="note">วัดจากข้อแรกที่ตอบของแต่ละโจทย์ (ไม่นับข้อที่ใช้คำใบ้หรือเขียนด้วยปากกา) เทียบกับเทคนิคอื่นของคุณเอง ไม่ใช่เกณฑ์สากล · เกณฑ์ +35% และแม่นต่ำกว่า 75% เป็นค่าที่ตั้งไว้ก่อน ยังไม่ได้ปรับ${w.pending?` · อีก ${w.pending} เทคนิคยังมีข้อมูลไม่ถึง ${w.need} ข้อ`:''}</p>`}

function render(){
  const t=today(),ratio=Math.min(1,t.a/GOAL),C=2*Math.PI*56;
  const tn=tempoNow(),tprev=tempoPrev(),dl=tn&&tprev?tn.v-tprev.v:null,ti=tn?tierIdx(tn.v):0,nt=TIERS[ti+1]||null,tp=nt&&tn?Math.max(0,Math.min(1,(tn.v-TIERS[ti].at)/(nt.at-TIERS[ti].at))):0;
  const tot=totals(),w1=winAcc(6,0),w0=winAcc(13,7),sp=sprintRuns();
  const cmp=w1.a>=10&&w0.a>=10?w1.pct-w0.pct:null;
  main.innerHTML=`
  <section class="hero glass" aria-labelledby="hb">
    <div>
      <p class="eyebrow">${tn?`Tempo ตอนนี้ · เฉลี่ย ${tn.n} Sprint ล่าสุด`:'Tempo'}</p>
      <h1 id="hb">${tn?`<span class="n tempo">${tn.v.toFixed(1)}</span><small class="unit">ข้อ/นาที</small><span class="tier">${TIERS[ti].th}</span>`:'ยังไม่มี Tempo'}</h1>
      ${tn?`<p class="delta ${dl===null?'':dl>=0?'up':'down'}">${dl===null?`สูงสุดที่เคยทำได้ ${tempoBest().toFixed(1)}`:`${dl>=0?'▲ +':'▼ −'}${Math.abs(dl).toFixed(1)} จาก 5 รอบก่อนหน้า · สูงสุด ${tempoBest().toFixed(1)}`}</p>
      ${nt?`<div class="xp"><p class="xp-t"><span>ระดับ ${TIERS[ti].th}</span><span>ถัดไป: ${nt.th} ที่ ${nt.at}</span></p><div class="xp-bar" style="--w:${Math.round(tp*100)}%"><i></i></div></div>`:''}`
      :'<p class="delta">เล่น Sprint 60 วินาทีรอบแรกเพื่อวัด Tempo ของคุณ</p>'}
      <div class="cta">
        <a class="btn pri go" href="play.html#sprint">${I('play')}เริ่ม Sprint 60 วินาที</a>
        <a class="btn" href="play.html#free">${I('free')}ไม่จับเวลา</a>
      </div>
      <p class="cta-note">Tempo = ข้อที่ตอบถูกต่อนาทีใน Sprint ถ่วงตามระดับโจทย์ (พื้นฐาน 1 · กลาง 1.5 · สูง 2) เฉลี่ย 5 รอบล่าสุด ตอบเยอะแต่ช้า หรือเลือกแต่ข้อง่าย จะไม่ทำให้ Tempo ขึ้น</p>
    </div>
    <div class="today">
      <div class="today-l">
        <div class="ring" role="img" aria-label="วันนี้ตอบแล้ว ${t.a} จากเป้า ${GOAL} ข้อ"><svg viewBox="0 0 132 132"><circle class="trk" cx="66" cy="66" r="56"/><circle class="val" cx="66" cy="66" r="56" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-ratio)).toFixed(1)}"/></svg><div class="mid"><b>${t.a}</b><small>/ ${GOAL} ข้อ</small></div></div>
        <div><p class="eyebrow" style="margin:0">เป้าหมายวันนี้</p><p class="streak">${I('flame')}<span class="n">${streakDays()}</span>&nbsp;วันติดต่อกัน</p></div>
      </div>
    </div>
  </section>

  <section class="panel glass" aria-labelledby="hh">
    <div class="panel-h"><h2 id="hh">วันที่เล่น 52 สัปดาห์ล่าสุด</h2>
      <div class="seg2" role="group" aria-label="มุมมอง heatmap"><button data-m="vol" aria-pressed="${heatMode==='vol'}">จำนวนข้อ</button><button data-m="acc" aria-pressed="${heatMode==='acc'}">ความแม่น %</button></div></div>
    ${tot.a?'':'<p class="empty" style="margin-bottom:10px">ยังไม่มีสถิติ เล่นรอบแรกแล้วช่องของวันนี้จะขึ้นสี</p>'}
    ${heatHTML()}
  </section>

  <section class="panel glass" aria-labelledby="hw">
    <div class="panel-h"><h2 id="hw">จุดอ่อนที่เสียเวลา</h2></div>
    ${weakHTML()}
  </section>

  <section class="panel glass" aria-labelledby="hs">
    <div class="panel-h"><h2 id="hs">สถิติของคุณ</h2></div>
    <dl class="facts">
      <div><dt>Tempo สูงสุด</dt><dd>${sp.length?tempoBest().toFixed(1):'–'} <small>${sp.length?`Sprint สูงสุด ${bestSprint()} ข้อ · ${sp.length} รอบ`:''}</small></dd></div>
      <div><dt>ถูกติดกันสูงสุด</dt><dd>${D.runs.length?bestRunStreak():'–'} <small>${D.runs.length?'ข้อในรอบเดียว':''}</small></dd></div>
      <div><dt>ตอบทั้งหมด</dt><dd>${tot.a} <small>${tot.a?`ข้อ · ถูก ${Math.round(100*tot.c/tot.a)}%`:''}</small></dd></div>
      <div><dt>แม่น 7 วันล่าสุด</dt><dd>${w1.a?w1.pct+'%':'–'} ${cmp===null?'':`<small class="${cmp>=0?'up':'down'}">${cmp>=0?'+':'−'}${Math.abs(cmp)} จุด จากสัปดาห์ก่อน</small>`}</dd></div>
    </dl>
    ${trendHTML()}
  </section>`;
  heat.addEventListener('click',e=>{const c=e.target.closest('.cell[data-k]');if(c)readDay(c.dataset.k)});
  heat.addEventListener('mouseover',e=>{const c=e.target.closest('.cell[data-k]');if(c)readDay(c.dataset.k)});
  heat.addEventListener('focusin',e=>{const c=e.target.closest('.cell[data-k]');if(c)readDay(c.dataset.k)});
  readDay(dayKey());
  document.querySelectorAll('.seg2 button').forEach(x=>x.onclick=()=>{heatMode=x.dataset.m;const sc=heatWrap.scrollLeft;render();heatWrap.scrollLeft=sc});
  heatWrap.scrollLeft=heatWrap.scrollWidth;
  updateChip()}

window.onData=render;
mountShell('home');render();initAuth();
</script>
</body>
</html>
